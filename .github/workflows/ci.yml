name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --lib

      - name: Test
        run: cargo test --lib

      - name: Build documentation
        run: cargo doc --no-deps

  examples:
    name: examples
    runs-on: ubuntu-latest
    # The plantuml example renders through plantuml.com when no local jar is
    # present, so this job depends on an external service and is allowed to fail
    # without blocking the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build examples
        run: cargo build --examples

      - name: Generate example docs
        run: cargo doc --examples --no-deps
